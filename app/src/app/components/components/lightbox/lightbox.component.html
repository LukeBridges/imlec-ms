<div class="dialog-header">
  <h1 mat-dialog-title>{{data.title}}</h1>
  <button mat-icon-button class="close-button" [mat-dialog-close]="true" aria-label="Close">
    <mat-icon class="close-icon" color="warn">close</mat-icon>
  </button>
</div>
<div mat-dialog-content>
  @if(data.src){
    <img class="dialog-image" src="/assets/{{data.src}}" alt="{{data.title}}"/>
  }
  @if(data.href){
    <div class="iframe-wrapper">
      <iframe [src]="data.href | safe" style="border: 0;"
              allowfullscreen="" aria-hidden="false" tabindex="0"></iframe>
    </div>
  }
</div>
